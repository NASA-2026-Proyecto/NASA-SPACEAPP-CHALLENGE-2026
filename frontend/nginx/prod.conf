# Producción. Se incluye dentro del bloque server de default.conf.template.
server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# Los nombres de fichero no llevan hash: HTML, CSS y JS se revalidan siempre (ETag)
location ~* \.(?:html|css|js)$ {
    expires -1;
    try_files $uri =404;
}

# Teselas, imágenes y fuentes casi nunca cambian
location ~* \.(?:webp|png|jpg|svg|woff2)$ {
    expires 30d;
    try_files $uri =404;
}
