<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Jukebox · Explorador</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/explorer.css">
  <link rel="stylesheet" href="css/explorer-shell.css">
</head>

<body class="explorer">

  <!-- Fondo de galaxia: estrellas (canvas) + nebulosa (CSS, ver explorer.css) -->
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

  <header class="explorer__nav navbar">
    <a class="ej-brand" href="index.html" aria-label="Earth Jukebox, volver a la portada">
      <svg class="ej-brand__icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true">
        <circle cx="20" cy="20" r="15" stroke="currentColor" stroke-width="1.5" />
        <path d="M5.8 16H34.2 M5.8 24H34.2" stroke="currentColor" stroke-width="0.8" opacity="0.6" />
        <path d="M20 5C11 13 11 27 20 35 M20 5C29 13 29 27 20 35" stroke="currentColor" stroke-width="0.8"
          opacity="0.6" />
        <path d="M3 20H10L13 15L17 26L21 11L25 25L28 17L31 20H37" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="ej-brand__name">Earth Jukebox</span>
    </a>

    <div class="ej-chip" role="status">
      <span class="ej-chip__icon" data-icon="signal" aria-hidden="true"></span>
      <span id="mode-chip-text">Sin capa activa: en silencio</span>
    </div>

    <div class="ej-navbar__actions">
      <label class="ej-night" for="night-mode">
        <span class="ej-night__icon" data-icon="moon" aria-hidden="true"></span>
        <span class="ej-night__text">Modo noche</span>
        <input class="ej-switch" type="checkbox" role="switch" id="night-mode">
      </label>
    </div>
  </header>

  <!-- IZQUIERDA · Capas de datos (las filas las genera js/ui/layer-panel.js desde config.js) -->
  <aside class="ej-panel ej-panel--layers" aria-labelledby="ej-panel-title">
    <div class="ej-panel__header">
      <span class="ej-panel__badge" data-icon="layers" aria-hidden="true"></span>
      <h2 id="ej-panel-title" class="ej-panel__title">Capas de datos</h2>
      <button class="ej-icon-btn" type="button" aria-expanded="true" aria-controls="ej-panel-body" data-panel-toggle
        data-panel-name="capas" aria-label="Plegar panel de capas">
        <span aria-hidden="true">–</span>
      </button>
    </div>

    <div id="ej-panel-body" class="ej-panel__body">
      <ul id="layer-list" class="ej-layers list-unstyled"></ul>
      <div class="ej-panel__actions">
        <button id="fly-spain" class="ej-btn ej-btn--ghost" type="button">
          <span class="ej-btn__icon" data-icon="pin" aria-hidden="true"></span>
          Ir a España
        </button>
      </div>
      <p class="ej-panel__note">
        PENDIENTE
      </p>
    </div>
  </aside>

  <main class="explorer__stage">
    <div id="globe-container" class="globe" aria-label="Globo terrestre">
      <div id="map" class="globe__map"></div>
      <p id="globe-status-text" class="globe__status" role="status">Cargando mapa…</p>
    </div>
  </main>

  <!-- DERECHA · Punto seleccionado: su sonido (js/ui/player.js, mediante los data-*) y su
       ficha de datos (js/ui/point-card.js, que js/pages/explorer.js coloca en los dos huecos) -->
  <section class="ej-panel ej-panel--signal" id="player" aria-labelledby="signal-title">
    <div class="ej-panel__header">
      <span class="ej-panel__badge ej-panel__badge--violet" data-icon="signal" aria-hidden="true"></span>
      <div class="ej-panel__heading">
        <h2 id="signal-title" class="ej-panel__title">Punto seleccionado</h2>
        <p class="ej-player__sub" data-player-sub>Sin capa activa: no suena nada. Activa una capa de datos.</p>
      </div>
      <button class="ej-icon-btn" type="button" aria-expanded="true" aria-controls="signal-body" data-panel-toggle
        data-panel-name="punto" aria-label="Plegar panel de punto">
        <span aria-hidden="true">–</span>
      </button>
    </div>

    <div id="signal-body" class="ej-panel__body">
      <div id="point-coords" hidden></div>

      <dl class="ej-player__readout">
        <div class="ej-stat ej-stat--tone">
          <dt><span class="ej-stat__icon" data-icon="tone" aria-hidden="true"></span>Capa</dt>
          <dd data-readout-layer>—</dd>
        </div>
        <div class="ej-stat ej-stat--value">
          <dt><span class="ej-stat__icon" data-icon="gauge" aria-hidden="true"></span>Valor</dt>
          <dd data-readout-value>—</dd>
        </div>
        <div class="ej-stat ej-stat--level">
          <dt><span class="ej-stat__icon" data-icon="level" aria-hidden="true"></span>Intensidad</dt>
          <dd data-readout-level>—</dd>
        </div>
      </dl>

      <canvas class="ej-wave" data-player-wave role="img"
        aria-label="Forma de onda del sonido en tiempo real"></canvas>

      <div class="ej-player__main">
        <button class="ej-play" type="button" data-player-play aria-pressed="false" aria-label="Reproducir"
          disabled>
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
          </svg>
        </button>

        <label class="ej-volume">
          <span class="ej-volume__icon" data-icon="speaker" aria-hidden="true"></span>
          <span class="visually-hidden">Volumen</span>
          <input class="ej-slider ej-slider--plain" type="range" min="0" max="1" step="0.01" value="0.35"
            data-player-volume>
        </label>
      </div>

      <label class="ej-spatial" for="spatial-audio">
        <span class="ej-spatial__text">3D con auriculares</span>
        <input class="ej-switch" type="checkbox" role="switch" id="spatial-audio" data-player-spatial
          aria-describedby="spatial-note">
      </label>
      <p class="ej-spatial__note" id="spatial-note" data-player-spatial-note></p>

      <p class="ej-player__description" aria-live="polite" data-player-description></p>

      <div id="point-card" hidden></div>
    </div>
  </section>

  <script type="module" src="js/pages/explorer.js"></script>
</body>

</html>
