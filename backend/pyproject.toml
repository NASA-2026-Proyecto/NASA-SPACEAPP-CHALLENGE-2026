[project]
name = "earth-jukebox-api"
version = "0.1.0"
description = "Earth Jukebox API: Earth observation data prepared for sonification (NASA Space Apps 2026)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "numpy>=2.5.4",
    "openexr>=3.5.4",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# Aplicación, no librería: el código se ejecuta desde backend/ y no se instala como paquete
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, docstrings, anotaciones de tipo
select = ["E", "F", "I", "UP", "B", "SIM", "D", "ANN"]
# D107: el constructor se documenta en la clase o con sus argumentos, no hace falta repetirlo
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# En los tests el nombre de cada test ya dice qué comprueba
"tests/**" = ["D", "ANN"]

[tool.mypy]
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["OpenEXR"]
ignore_missing_imports = true

# Cobertura: `uv run pytest --cov` (la API; los scripts de geosfp/ y tools/ se ejecutan a mano)
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
pipeline = [
    "numpy>=2.5.4",
    "pydap>=3.5.11",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "xarray>=2026.9.0",
]
